:root{--bg:#fbfaf7;--card:#fff;--ink:#2e2822;--body:#4a4036;--gold:#a38556;--rule:#d9c9a8;--dark:#2e2822;--ok:#4f7a4a;--bad:#a8432f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--body)}
body{font:500 18px/1.4 'Cormorant Garamond',Georgia,serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}
header{text-align:center;padding:6px 0 4px}
header img{width:130px;max-width:50%}
.tag{font:400 11px 'Josefin Sans',sans-serif;letter-spacing:.32em;color:var(--gold);margin-top:8px;text-transform:uppercase}
h1{display:flex;align-items:center;gap:12px;font:600 20px 'Josefin Sans',sans-serif;letter-spacing:.32em;color:var(--ink);margin:22px 0 6px;text-transform:uppercase;white-space:nowrap}
h1::before,h1::after{content:"";flex:1;border-top:1px solid #b89a66}
.sub{text-align:center;font-style:italic;color:var(--body);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--rule);padding:18px 12px 16px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.98)}.tile:hover{border-color:var(--gold)}
.tile .ic{font-size:30px;line-height:1}
.tile .t{font:600 12px 'Josefin Sans',sans-serif;letter-spacing:.18em;color:var(--ink);margin-top:10px;text-transform:uppercase}
.tile .d{font-size:15px;margin-top:4px;color:var(--body)}
.tile.wide{grid-column:1/-1;background:var(--dark);border-color:var(--dark)}
.tile.wide .t{color:#fff}.tile.wide .d{color:#d9c9a8}
.panel{background:var(--card);border:1px solid var(--rule);padding:20px 16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back{font:600 11px 'Josefin Sans',sans-serif;letter-spacing:.2em;color:var(--gold);background:none;border:none;cursor:pointer;text-transform:uppercase;padding:6px 0}
.prog{font:400 11px 'Josefin Sans',sans-serif;letter-spacing:.2em;color:var(--gold)}
.bar{height:3px;background:#eee6d6;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font:600 22px/1.25 'Cormorant Garamond',Georgia,serif;color:var(--ink);margin-bottom:16px}
.emo{font-size:52px;text-align:center;margin:6px 0 14px;letter-spacing:6px}
.scr{font:600 30px 'Josefin Sans',sans-serif;letter-spacing:.3em;text-align:center;color:var(--ink);margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;font:500 18px 'Cormorant Garamond',Georgia,serif;color:var(--ink);background:#fff;border:1px solid var(--rule);padding:13px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--gold)}
.opt.ok{background:#eef4ec;border-color:var(--ok);color:var(--ok)}
.opt.bad{background:#f8ece9;border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fact{font-style:italic;font-size:16px;color:var(--body);border-left:2px solid var(--gold);padding:4px 0 4px 10px;margin:4px 0 12px;display:none}
.btn{display:block;width:100%;font:600 13px 'Josefin Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#fff;background:var(--dark);border:none;padding:15px;cursor:pointer;margin-top:8px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--rule)}
input.ans{width:100%;font:600 20px 'Josefin Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:12px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
.hint{font-size:15px;text-align:center;color:var(--gold);margin-top:8px;min-height:20px}
.big{font:600 56px 'Josefin Sans',sans-serif;color:var(--ink);text-align:center;margin:8px 0 2px}
.res{text-align:center;font-size:20px;margin-bottom:14px}
.card{font:600 24px/1.3 'Cormorant Garamond',Georgia,serif;color:var(--ink);text-align:center;padding:30px 8px;min-height:150px;display:flex;align-items:center;justify-content:center}
.wyr{display:grid;gap:10px}
.wyr .opt{text-align:center;font-weight:600}
.or{text-align:center;font:600 11px 'Josefin Sans',sans-serif;letter-spacing:.3em;color:var(--gold)}
footer{text-align:center;font-size:14px;color:#7a6e60;margin-top:26px;line-height:1.5}
footer .f{font:400 10px 'Josefin Sans',sans-serif;letter-spacing:.3em;color:var(--gold);margin-top:8px}
.hide{display:none}
</style>
</head>

function home(){
  $('#app').innerHTML=`<h1>Polos Play</h1><p class="sub">Games for the table while you wait.</p><div class="grid">${GAMES.map(g=>`<div class="tile ${g.wide?'wide':''}" onclick="start('${g.id}')"><div class="ic">${g.ic}</div><div class="t">${g.t}</div><div class="d">${g.d}</div></div>`).join('')}</div>`;
  window.scrollTo(0,0);
}
function shell(title,inner,prog){return `<div class="top"><button class="back" onclick="home()">‹ Games</button><span class="prog">${prog||''}</span></div><h1 style="margin-top:0">${title}</h1>${inner}`}

/* multiple-choice engine */
function quiz(title,items,render){
  let i=0,score=0;
  const step=()=>{
    if(i>=items.length) return done();
    const it=items[i],opts=shuffle([it.a,...it.o]);
    $('#app').innerHTML=shell(title,`<div class="bar"><i style="width:${i/items.length*100}%"></i></div><div class="panel">${render(it)}
      ${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}
      <div class="fact" id="fact">${esc(it.f||'')}</div><button class="btn hide" id="nx">${i+1<items.length?'Next':'See score'}</button></div>`,`${i+1} / ${items.length}`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const right=b.dataset.v===it.a; if(right) score++;
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.v===it.a) x.classList.add('ok')});
      if(!right) b.classList.add('bad');
      if(it.f) $('#fact').style.display='block';
      $('#nx').classList.remove('hide'); $('#nx').onclick=()=>{i++;step()};
    });
  };
  const done=()=>{
    const n=items.length,pct=score/n;
    const msg=pct===1?'Perfect score. Take a bow.':pct>=.7?'Very impressive.':pct>=.4?'Not bad at all.':'Great effort. Try again?';
    $('#app').innerHTML=shell(title,`<div class="panel"><div class="big">${score}/${n}</div><p class="res">${msg}</p><button class="btn" onclick="start('${curr}')">Play again</button><button class="btn ghost" onclick="home()">More games</button></div>`);
  };
  step();
}
let curr='';
function start(id){
  curr=id; window.scrollTo(0,0);
  if(id==='trivia') quiz('Trivia',shuffle(TRIVIA).slice(0,10),it=>`<p class="q">${esc(it.q)}</p>`);
  if(id==='menu') quiz('Menu Match',shuffle(MENU).slice(0,8),it=>`<p class="q">Which dish is this?</p><p class="q" style="font-weight:500;font-style:italic">“${esc(it.q)}”</p>`);
  if(id==='emoji') quiz('Emoji Eats',shuffle(EMOJI).slice(0,8),it=>`<p class="q">Which Polos dish is this?</p><div class="emo">${it.e}</div>`);
  if(id==='scramble') scramble();
  if(id==='wyr') cards('Would You Rather',shuffle(WYR),p=>`<div class="wyr"><button class="opt">${esc(p[0])}</button><div class="or">OR</div><button class="opt">${esc(p[1])}</button></div>`,true);
  if(id==='talk') cards('Table Talk',shuffle(TALK),t=>`<div class="card">${esc(t)}</div>`,false);
}
function cards(title,list,render,pick){
  let i=0;
  const step=()=>{
    const it=list[i%list.length];
    $('#app').innerHTML=shell(title,`<div class="panel">${render(it)}<button class="btn" id="nx">Next</button></div>`,'Tap to play');
    if(pick) document.querySelectorAll('.wyr .opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.wyr .opt').forEach(x=>x.classList.remove('ok'));b.classList.add('ok')});
    $('#nx').onclick=()=>{i++;step()};
  };
  step();
}
function mix(w){let s;do{s=shuffle(w.split('')).join('')}while(s===w);return s}
function scramble(){
  const words=shuffle(SCRAMBLE).slice(0,6);let i=0,score=0;
  const step=()=>{
    if(i>=words.length){$('#app').innerHTML=shell('Word Scramble',`<div class="panel"><div class="big">${score}/${words.length}</div><p class="res">${score===words.length?'Perfect. Wordsmith of the table.':'Nice work.'}</p><button class="btn" onclick="start('scramble')">Play again</button><button class="btn ghost" onclick="home()">More games</button></div>`);return}
    const w=words[i];let tries=0;
    $('#app').innerHTML=shell('Word Scramble',`<div class="bar"><i style="width:${i/words.length*100}%"></i></div><div class="panel"><p class="q" style="text-align:center">Unscramble this menu word</p><div class="scr">${mix(w)}</div>
      <input class="ans" id="ans" autocomplete="off" autocapitalize="characters" placeholder="Your answer"><div class="hint" id="h"></div><button class="btn" id="go">Check</button><button class="btn ghost" id="sk">Skip</button></div>`,`${i+1} / ${words.length}`);
    const check=()=>{const v=$('#ans').value.trim().toUpperCase();
      if(v===w){score++;$('#h').textContent='Correct!';setTimeout(()=>{i++;step()},700)}
      else{tries++;$('#h').textContent=tries>=2?`Hint: it starts with “${w[0]}” and ends with “${w[w.length-1]}”`:'Not quite. Try again.'}};
    $('#go').onclick=check;$('#ans').onkeydown=e=>{if(e.key==='Enter')check()};
    $('#sk').onclick=()=>{$('#h').textContent=`It was ${w}`;setTimeout(()=>{i++;step()},900)};
  };
  step();
}
home();
</script>
